version: "3.9"

services:
  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: book-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: book-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
